<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRUD Data Alat</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
    .field { margin: 0 0 .75rem 0; }
    label { display: block; font-weight: 600; margin-bottom: .25rem; }
    input, select { width: 100%; padding: .5rem; box-sizing: border-box; }
    .error { color: #b00020; font-size: .9rem; display: block; min-height: 1.1em; }
    [aria-invalid="true"] { border: 2px solid #b00020; }
    #pesan { padding: .5rem .75rem; border-left: 4px solid #888; background: #f3f3f3; margin: 1rem 0; }
    #pesan.error { border-color: #c0392b; background: #fdecea; }
    #pesan.success { border-color: #1e8449; background: #eafaf1; }
    .toolbar { display: flex; gap: .5rem; margin: 1rem 0; }
    .toolbar input { flex: 2; } .toolbar select { flex: 1; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid #ddd; padding: .5rem; text-align: left; }
    .paging { display: flex; gap: .75rem; align-items: center; margin-top: 1rem; }
    button { padding: .4rem .8rem; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Data Alat</h1>

    <form id="form-alat" novalidate>
      <h2 id="judul-form">Tambah Alat</h2>
      <input type="hidden" id="id" name="id">

      <p class="field">
        <label for="nama">Nama alat *</label>
        <input type="text" id="nama" name="nama" maxlength="120" required>
        <small class="error" id="error-nama"></small>
      </p>
      <p class="field">
        <label for="kategori">Kategori *</label>
        <input type="text" id="kategori" name="kategori" maxlength="80" required list="daftar-kategori">
        <datalist id="daftar-kategori">
          <option value="Jaringan"><option value="Elektronika">
        </datalist>
        <small class="error" id="error-kategori"></small>
      </p>
      <p class="field">
        <label for="jumlah">Jumlah *</label>
        <input type="number" id="jumlah" name="jumlah" min="0" step="1" required>
        <small class="error" id="error-jumlah"></small>
      </p>
      <p class="field">
        <label for="kondisi">Kondisi *</label>
        <select id="kondisi" name="kondisi">
          <option>Baik</option><option>Perlu Cek</option><option>Rusak</option>
        </select>
        <small class="error" id="error-kondisi"></small>
      </p>
      <p class="field">
        <label for="lokasi">Lokasi</label>
        <input type="text" id="lokasi" name="lokasi" maxlength="120">
        <small class="error" id="error-lokasi"></small>
      </p>

      <button type="submit" id="btn-simpan">Simpan</button>
      <button type="button" id="btn-batal" hidden>Batal edit</button>
    </form>

    <p id="pesan" role="status" aria-live="polite">Memuat data...</p>

    <div class="toolbar">
      <input type="search" id="cari" placeholder="Cari nama alat..." aria-label="Cari nama alat">
      <select id="filter-kategori" aria-label="Filter kategori">
        <option value="">Semua kategori</option>
        <option>Jaringan</option><option>Elektronika</option>
      </select>
    </div>

    <table>
      <thead>
        <tr><th>Nama</th><th>Kategori</th><th>Jumlah</th><th>Kondisi</th><th>Lokasi</th><th>Aksi</th></tr>
      </thead>
      <tbody id="tabel-alat"></tbody>
    </table>

    <nav class="paging" aria-label="Paginasi">
      <button type="button" id="btn-prev">&laquo; Sebelumnya</button>
      <span id="info-halaman"></span>
      <button type="button" id="btn-next">Berikutnya &raquo;</button>
    </nav>
  </main>

  <script src="Js/alat-crud.js"></script>
</body>
</html>
