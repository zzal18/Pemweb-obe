<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Form Data Alat</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 2rem auto; padding: 0 1rem; }
    .field { margin: 0 0 1rem 0; }
    label { display: block; font-weight: 600; margin-bottom: .25rem; }
    input, select { width: 100%; padding: .5rem; box-sizing: border-box; }
    .error { color: #b00020; font-size: .9rem; display: block; min-height: 1.2em; }
    [aria-invalid="true"] { border: 2px solid #b00020; }
    #form-status { margin: 1rem 0; font-weight: 600; }
    #preview { background: #f0f7f0; padding: 1rem; border-radius: 6px; }
  </style>
</head>
<body>
  <main>
    <h1>Form Data Alat</h1>

    <form id="form-alat" novalidate>
      <p class="field">
        <label for="nama">Nama alat <span aria-hidden="true">*</span></label>
        <input type="text" id="nama" name="nama" required minlength="3"
                aria-describedby="error-nama">
        <small class="error" id="error-nama"></small>
      </p>

      <p class="field">
        <label for="kategori">Kategori <span aria-hidden="true">*</span></label>
        <select id="kategori" name="kategori" required aria-describedby="error-kategori">
          <option value="">-- Pilih kategori --</option>
          <option value="elektronik">Elektronik</option>
          <option value="mekanik">Mekanik</option>
          <option value="jaringan">Jaringan</option>
          <option value="lainnya">Lainnya</option>
        </select>
        <small class="error" id="error-kategori"></small>
      </p>

      <p class="field">
        <label for="jumlah">Jumlah <span aria-hidden="true">*</span></label>
        <input type="number" id="jumlah" name="jumlah" required min="0" step="1"
                aria-describedby="error-jumlah">
        <small class="error" id="error-jumlah"></small>
      </p>

      <p class="field">
        <label for="kondisi">Kondisi <span aria-hidden="true">*</span></label>
        <select id="kondisi" name="kondisi" required aria-describedby="error-kondisi">
          <option value="">-- Pilih kondisi --</option>
          <option value="baik">Baik</option>
          <option value="rusak-ringan">Rusak ringan</option>
          <option value="rusak-berat">Rusak berat</option>
        </select>
        <small class="error" id="error-kondisi"></small>
      </p>

      <p class="field">
        <label for="tanggal">Tanggal perolehan <span aria-hidden="true">*</span></label>
        <input type="date" id="tanggal" name="tanggal" required
                aria-describedby="error-tanggal">
        <small class="error" id="error-tanggal"></small>
      </p>

      <button type="submit">Simpan</button>
    </form>

    <p id="form-status" role="status" aria-live="polite"></p>

    <section id="preview" hidden aria-labelledby="judul-preview">
      <h2 id="judul-preview">Preview Data</h2>
      <dl id="preview-list"></dl>
    </section>
  </main>

  <script src="Js/form-alat.js"></script>
</body>
</html>
